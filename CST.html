<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
 <title>CST Profs</title>
    <link rel="stylesheet" href="CST.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;1,400;1,600&family=Antonio:wght@600;700&family=Keania+One&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root{
    --red: #A50000;
    --blue-content: #002B98;
    --blue-light: #B2C8FF;
    --card-bg: #EBEBEB;
    --black: #000000;
    --white: #ffffff;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    background: var(--black);
    font-family: 'Alegreya', serif;
    padding: 48px 20px 80px;
      background: #000 url('tape2.png') center center / cover no-repeat fixed;
  }

  /* ---------- Header ---------- */
  .header{
    max-width: 820px;
    margin: 0 auto 44px;
    border: 1.5px solid #d8d8d8;
    border-radius: 42px;
    padding: 8px 30px 10px;
    text-align: center;
  }

  .dept-line{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 0;
  }

  

  .dept-of{
    font-family: 'Patrick Hand', cursive;
    color: var(--white);
    font-size: 1.15rem;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  .dept-title{
    font-family: 'Keania One', system-ui;
    color: var(--red);
    font-size: clamp(1.9rem, 6.2vw, 3.6rem);
    letter-spacing: 1px;
    margin: -2px 0 0;
    line-height: 1.05;
  }

  .faculty-line{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 0;
  }

  .faculty-line::before,
  .faculty-line::after{
    content: "";
    width: 70px;
    height: 1px;
    background: #6a6a6a;
  }

  .faculty-members{
    font-family: 'Patrick Hand', cursive;
    color: var(--blue-light);
    font-size: 1.15rem;
    white-space: nowrap;
  }

  /* ---------- Card ---------- */
  .card{
    width: 260px;
    background: var(--card-bg);
    border-radius: 18px;
    padding: 14px 14px 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }

  .photo{
    width: 100%;
    aspect-ratio: 1 / 1.02;
    background: var(--white);
    border-radius: 12px;
    margin-bottom: 14px;
  }

  .info{
    font-family: 'Alegreya', serif;
    font-size: 0.82rem;
    line-height: 1.5;
  }

  .row{
    display: grid;
    grid-template-columns: auto 1fr;
    column-gap: 6px;
    margin-bottom: 2px;
  }

  .label{
    color: var(--black);
    font-weight: 600;
    letter-spacing: 0.2px;
    white-space: nowrap;
  }

  .value{
    color: var(--blue-content);
    font-style: italic;
    font-weight: 500;
  }

  .row.phone,
  .row.email{
    margin-top: 6px;
  }

  .btn-wrap{
    margin-top: 18px;
    display: flex;
    justify-content: center;
  }

  .suspect-btn{
    font-family: 'Antonio', sans-serif;
    background: var(--red);
    color: var(--black);
    border: 0.5px solid var(--black);
    outline: 0.5px solid var(--black);
    outline-offset: 1px;
    border-radius: 999px;
    padding: 8px 22px;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease;
  }

  .suspect-btn:hover{
    filter: brightness(1.12);
  }

  .suspect-btn:active{
    transform: scale(0.97);
  }

  .suspect-btn:focus-visible{
    outline: 2px solid var(--blue-light);
    outline-offset: 3px;
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }

  .modal-overlay.open{ display: flex; }

  .modal{
    background: var(--card-bg);
    border-radius: 16px;
    padding: 26px 28px;
    max-width: 320px;
    text-align: center;
    border: 1px solid var(--red);
  }

  .modal h2{
    font-family: 'Antonio', sans-serif;
    color: var(--red);
    margin: 0 0 10px;
    letter-spacing: 0.5px;
  }

  .modal p{
    font-family: 'Alegreya', serif;
    color: var(--black);
    font-size: 0.95rem;
    margin: 0 0 18px;
  }

  .modal button{
    font-family: 'Antonio', sans-serif;
    background: var(--black);
    color: var(--white);
    border: none;
    border-radius: 999px;
    padding: 8px 20px;
    cursor: pointer;
  }
</style>
</head>
<body>


  <header class="header">
    <p class="dept-line"><span class="dept-of">Department Of</span></p>
    <h1 class="dept-title">Computer Science and Technology</h1>
    <p class="faculty-line"><span class="faculty-members">Faculty Members</span></p>
  </header>

  <main>
    <article class="card">
      <div class="photo" ></div>

      <div class="info">
        <div class="row">
          <span class="label">NAME:</span>
          <span class="value">Dr. Tamal Pal</span>
        </div>
        <div class="row">
          <span class="label">DESIGNATION:</span>
          <span class="value">Assistant Professor</span>
        </div>
        <div class="row">
          <span class="label">RESEARCH AREAS:</span>
          <span class="value">Image Processing, Wireless Multi-media Sensor Network</span>
        </div>
        <div class="row phone">
          <span class="label">PHONE:</span>
          <span class="value">033 2668 6151</span>
        </div>
        <div class="row email">
          <span class="label">EMAIL:</span>
          <span class="value">tamal@cs.iiests.ac.in</span>
        </div>
      </div>

      <div class="btn-wrap">
        <button class="suspect-btn" id="suspectBtn" type="button" onclick location.href="TP_profile.html">View Suspect Profile</button>
      </div>
    </article>
  </main>


<script>
  const btn = document.getElementById('suspectBtn');
  const overlay = document.getElementById('modalOverlay');
  const closeBtn = document.getElementById('modalClose');

  btn.addEventListener('click', () => overlay.classList.add('open'));
  closeBtn.addEventListener('click', () => overlay.classList.remove('open'));
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') overlay.classList.remove('open');
  });
</script>

</body>
</html>
